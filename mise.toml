[tools]
"cargo:cargo-ndk" = { path = "~/.cargo/bin/cargo-ndk" }

[env]
_.file = ".env"
ANDROID_HOME = "{{ env.ANDROID_HOME | default(value='/opt/homebrew/share/android-commandlinetools') }}"
ANDROID_SDK_ROOT = "{{ env.ANDROID_HOME | default(value='/opt/homebrew/share/android-commandlinetools') }}"

[tasks.setup]
description = "Install Android SDK components and the Rust Android target"
raw = true
run = """
sdkmanager --licenses
sdkmanager --install \
  "platform-tools" \
  "platforms;android-37.0" \
  "build-tools;37.0.0"
if [ -f native/reader-qr-native/Cargo.toml ]; then
  sdkmanager --install "ndk;29.0.14206865"
  rustup target add aarch64-linux-android
fi
"""

[tasks."rustls-aar:update"]
description = "Update the vendored rustls Android verifier AAR"
run = """
set -eu

native_manifest="native/reader-qr-native/Cargo.toml"
destination_aar="app/libs/rustls-platform-verifier.aar"

if [ ! -f "$native_manifest" ]; then
  echo "Native source is unavailable; keeping the vendored rustls verifier AAR."
  exit 0
fi

metadata="$(cargo metadata \
  --format-version 1 \
  --filter-platform aarch64-linux-android \
  --locked \
  --manifest-path "$native_manifest")"
component_manifest="$(printf '%s' "$metadata" | jq -er \
  'first(.packages[] | select(.name == "rustls-platform-verifier-android")).manifest_path')"
component_version="$(printf '%s' "$metadata" | jq -er \
  'first(.packages[] | select(.name == "rustls-platform-verifier-android")).version')"
component_root="$(dirname "$component_manifest")"
source_aar="$component_root/maven/rustls/rustls-platform-verifier/$component_version/rustls-platform-verifier-$component_version.aar"

if [ ! -f "$source_aar" ]; then
  echo "Compatible rustls verifier AAR is missing: $source_aar" >&2
  exit 1
fi

if [ -f "$destination_aar" ] && cmp -s "$source_aar" "$destination_aar"; then
  echo "rustls verifier AAR is already up to date at version $component_version."
  exit 0
fi

mkdir -p "$(dirname "$destination_aar")"
cp "$source_aar" "$destination_aar"
echo "Updated rustls verifier AAR to version $component_version."
"""

[tasks."native:check"]
description = "Format, lint, and test the Rust native crate"
run = """
if [ ! -f native/reader-qr-native/Cargo.toml ]; then
  echo "Native source is unavailable; skipping Rust checks."
  exit 0
fi
cargo fmt --manifest-path native/reader-qr-native/Cargo.toml -- --check
cargo clippy --manifest-path native/reader-qr-native/Cargo.toml --all-targets -- -D warnings
cargo test --manifest-path native/reader-qr-native/Cargo.toml
"""

[tasks."native:build"]
description = "Build the Android arm64 native library"
run = """
if [ ! -f native/reader-qr-native/Cargo.toml ]; then
  echo "Native source is unavailable; using the prebuilt library."
  exit 0
fi
cd native/reader-qr-native
cargo ndk \
  -t arm64-v8a \
  -P 35 \
  -o ../../app/build/generated/readerQrNative/jniLibs \
  build --release
"""

[tasks."prebuilt:check"]
description = "Build and test with the committed native library"
run = "./gradlew -PusePrebuiltReaderQrNative=true testDebugUnitTest assembleDebug lintDebug"

[tasks.test]
description = "Run Rust and Android debug unit tests"
depends = ["native:check"]
run = "./gradlew testDebugUnitTest"

[tasks.check]
description = "Run all local checks without creating an APK"
depends = ["native:check"]
run = "./gradlew testDebugUnitTest lintDebug"

[tasks.build]
description = "Test, lint, and build the debug APK"
depends = ["native:check"]
run = "./gradlew testDebugUnitTest assembleDebug lintDebug"

[tasks.install]
description = "Build, install, and launch the debug application"
depends = ["build"]
run = """
adb install -r app/build/outputs/apk/debug/app-debug.apk
adb shell monkey -p cn.ahlib.reservation.debug 1
"""
